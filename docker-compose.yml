services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass
      POSTGRES_DB: compass
    ports:
      - "55432:5432"
    volumes:
      - compass-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass -d compass"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  compass-db:
