services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: webmcp
      POSTGRES_PASSWORD: webmcp
      POSTGRES_DB: webmcp
    ports:
      - "55432:5432"
    volumes:
      - webmcp-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmcp -d webmcp"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  webmcp-db:
