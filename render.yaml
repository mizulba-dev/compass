services:
  - type: web
    name: webmcp-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webmcp-demo-db
          property: connectionString
      - key: PORT
        value: 8080

databases:
  - name: webmcp-demo-db
    plan: free
